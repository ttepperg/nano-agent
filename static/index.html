<!DOCTYPE html>
<html>
<head>
    <title>Nano Agent</title>
    <link rel='stylesheet' href='/static/style.css' />
    <script src="/static/app.js" defer></script>
</head>
<body>

    <header>
        <h1>Nano Agent</h1>
    </header>

    <div id="conversation"></div>

    <footer id="composer">
        <input id="task" type="text"
               placeholder="Enter a task">
        <button onclick="runAgent()">Run</button>
    </footer>

    <div id="usage-panel">
        <span class="usage-title">Token usage</span>
        <span id="prompt-tokens">Prompt: 0</span>
        <span id="completion-tokens">Completion: 0</span>
        <span id="total-tokens">Total: 0</span>
    </div>

    <!-- <script src="/static/script.js" defer></script> -->

</body>
</html>
